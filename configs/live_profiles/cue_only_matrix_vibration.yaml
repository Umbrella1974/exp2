# Cue-oriented display + Matrix/electrotactile + vibration motor feedback.
# Edit ESP32 IPs inside the referenced haptic config before running.
map_config: maps/examples/xoy_turn.json
host: 127.0.0.1
port: 8888
out_dir: data/live_integrated_session/cue_only_matrix_vibration_01

gui: true
cue_sink: gui_text
visual_profile: experiment_visibility_feedback
status_panel: hide
show_axes: hide
show_grid: hide

ignore_task_z: true
task_z_half_extent: 5.0
pinch_position_mode: nodes_world
thumb_node: 4
index_node: 14
tracker_index: 0
skeleton_index: 0

calibrate_pinch_threshold: true
pinch_threshold_config: configs/pinch_threshold_20_30.json
haptic_config: configs/haptic_matrix_vibration.example.json
interaction_config: configs/interaction_boundary_lock.example.json

