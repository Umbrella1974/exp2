# Example configuration template for this project.
# Current Python scripts do not automatically load this YAML yet.

preview:
  raw_jsonl: "D:/download_edge/dataansys/raw_frames_15_parts/experiment_01.jsonl"
  trial_id: "smoke_001"
  max_frames: 1000
  print_every: 10
  timestamp_scale: 0.001
  calibration: null

adapter:
  skeleton_index: 0
  tracker_index: 0
  thumb_tip_node_id: 4
  index_tip_node_id: 9
  local_offset: [0.0, 0.0, 0.0]
  local_scale: 1.0
  use_tracker_rotation: false

engine:
  block_size_x: 1.0
  block_size_y: 1.0
  block_size_z: 1.0
  track_epsilon: 0.000001
  pinch_grab_threshold: 0.025
  pinch_release_threshold: 0.035
  max_hand_delta_per_frame: 0.25
  min_block_move_distance: 0.00001
  blocked_feedback_threshold: 0.0001
  binary_search_iterations: 24
  max_detach_count: 3
  trial_timeout_seconds: 60.0
  slip_motion_threshold: 0.0001

task_coordinate_system:
  # Preview uses demo axes unless --calibration points to a calibration JSON.
  # This YAML section is a record template, not currently loaded by code.
  origin_world: [0.0, 0.0, 0.0]
  x_axis_world: [1.0, 0.0, 0.0]
  y_axis_world: [0.0, 1.0, 0.0]
  z_axis_world: [0.0, 0.0, 1.0]
  metadata:
    up_axis_world: [0.0, 0.0, 1.0]
